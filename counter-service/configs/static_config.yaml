components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

        grpc-blocking-task-processor:
            worker_threads: 2
            thread_name: grpc-worker

    default_task_processor: main-task-processor

    components:
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000

        testsuite-support: {}

        congestion-control:
            load-enabled: false

        dns-client:
            fs-task-processor: fs-task-processor

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        server:
            listener:
                port: $http-port
                task_processor: main-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        grpc-server:
            port: $grpc-port

        grpc-server-middlewares-pipeline: {}

        counter-grpc-service:
            task-processor: main-task-processor

        secdist: {}
        default-secdist-provider:
            config: $secdist-path
            missing-ok: true
            environment-secrets-key: SECDIST_CONFIG

        key-value-database:
            groups:
              - config_name: counter-redis
                db: counter-redis
                sharding_strategy: RedisStandalone
                allow_reads_from_master: true
            subscribe_groups: []
            thread_pools:
                redis_thread_pool_size: 4
                sentinel_thread_pool_size: 1

        rabbitmq-driver:
            secdist_alias: rabbitmq-driver
            min_pool_size: 2
            max_pool_size: 10
            max_in_flight_requests: 10
            use_secure_connection: false

        counter-consumer:
            rabbit_name: rabbitmq-driver
            queue: message-counters
            prefetch_count: 100

        counter-reconciler: {}
