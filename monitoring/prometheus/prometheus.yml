global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'chat-service'
    metrics_path: /metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['chat-service:1188']
        labels:
          service: 'chat-service'
