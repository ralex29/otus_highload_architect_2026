  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: social-net-citus-coordinator
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15436:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
      - ./postgresql/schemas/citus_coordinator.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgresql/init-citus.sh:/docker-entrypoint-initdb.d/02-init-citus.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social-net-network

  citus-worker-0:
    image: citusdata/citus:12.1
    container_name: social-net-citus-worker-0
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15437:5432"
    volumes:
      - citus-worker-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - social-net-network

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: social-net-citus-worker-1
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15438:5432"
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - social-net-network

  redis:
    image: redis:7-alpine
    container_name: social-net-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - social-net-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: social-net-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-net-network

  redis-counter-init:
    image: redis:7-alpine
    container_name: social-net-redis-counter-init
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - social-net-network
    volumes:
      - ./scripts/redis:/scripts:ro
    entrypoint: ["sh", "/scripts/counter_init.sh"]
    restart: "no"

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
      target: runtime
    container_name: social-net-chat-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      citus-coordinator:
        condition: service_healthy
      redis-counter-init:
        condition: service_completed_successfully
    environment:
      SECDIST_CONFIG: '{"redis_settings":{"dialog-redis":{"password":"","sentinels":[{"host":"redis","port":6379}],"shards":[{"name":"test_standalone_master0"}]}},"rabbitmq_settings":{"rabbitmq-driver":{"hosts":["rabbitmq"],"port":5672,"login":"guest","password":"guest","vhost":"/"}}}'
    ports:
      - "8081:8081"
      - "8090:8090"
    networks:
      - social-net-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  counter-service:
    build:
      context: .
      dockerfile: counter-service/Dockerfile
      target: runtime
    container_name: social-net-counter-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-counter-init:
        condition: service_completed_successfully
    environment:
      SECDIST_CONFIG: '{"redis_settings":{"counter-redis":{"password":"","sentinels":[{"host":"redis","port":6379}],"shards":[{"name":"test_standalone_master0"}]}},"rabbitmq_settings":{"rabbitmq-driver":{"hosts":["rabbitmq"],"port":5672,"login":"guest","password":"guest","vhost":"/"}}}'
    ports:
      - "8082:8082"
      - "8091:8091"
    networks:
      - social-net-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      counter-service:
        condition: service_healthy
    environment:
      DB_CONNECTION: postgresql://testsuite:testsuite@postgres-master:5432/social_net_service_db_1
      CPU_LIMIT: "4"
      SECDIST_CONFIG: '{"redis_settings":{"feed-redis":{"password":"","sentinels":[{"host":"redis","port":6379}],"shards":[{"name":"test_standalone_master0"}]}},"rabbitmq_settings":{"rabbitmq-driver":{"hosts":["rabbitmq"],"port":5672,"login":"guest","password":"guest","vhost":"/"}}}'
    ports:
      - "8080"
    volumes:
      - ./configs:/app/configs:ro
    networks:
      - social-net-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  social-net-network:
    driver: bridge

volumes:
  postgres-master-data:
    driver: local
  citus-coordinator-data:
    driver: local
  citus-worker-0-data:
    driver: local
  citus-worker-1-data:
    driver: local
#  postgres-replica-1-data:
#    driver: local
#  postgres-replica-2-data:
#    driver: local
