services:
  postgres-master:
    image: postgres:15-alpine
    container_name: social-net-postgres-master
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_net_service_db_1
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=256MB
      - -c
      - hot_standby=on
    ports:
      - "15433:5432"
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgresql/schemas/db_1.sql:/docker-entrypoint-initdb.d/schemas/db_1.sql:ro
      - ./postgresql/data:/docker-entrypoint-initdb.d/data:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./postgresql/setup-replication.sh:/docker-entrypoint-initdb.d/02-setup-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_service_db_1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - social-net-network

  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: social-net-citus-coordinator
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15436:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
      - ./postgresql/schemas/citus_coordinator.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgresql/init-citus.sh:/docker-entrypoint-initdb.d/02-init-citus.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social-net-network

  citus-worker-0:
    image: citusdata/citus:12.1
    container_name: social-net-citus-worker-0
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15437:5432"
    volumes:
      - citus-worker-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - social-net-network

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: social-net-citus-worker-1
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: social_net_dialogs
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15438:5432"
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsuite -d social_net_dialogs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - social-net-network

  redis:
    image: redis:7-alpine
    container_name: social-net-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - social-net-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-0:
    image: rabbitmq:3-management-alpine
    hostname: rabbit-0
    container_name: rabbitmq-0
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "shared-secret-cookie"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - social-net-network

  rabbitmq-1:
    image: rabbitmq:3-management-alpine
    hostname: rabbit-1
    container_name: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "shared-secret-cookie"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - social-net-network

  rabbitmq-2:
    image: rabbitmq:3-management-alpine
    hostname: rabbit-2
    container_name: rabbitmq-2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "shared-secret-cookie"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - social-net-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres-master:
        condition: service_healthy
      citus-coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq-0:
        condition: service_healthy
    environment:
      DB_CONNECTION: postgresql://testsuite:testsuite@postgres-master:5432/social_net_service_db_1
      DB_CITUS_CONNECTION: postgresql://testsuite:testsuite@citus-coordinator:5432/social_net_dialogs
      CPU_LIMIT: "4"
      SECDIST_CONFIG: '{"redis_settings":{"feed-redis":{"password":"","sentinels":[{"host":"redis","port":6379}],"shards":[{"name":"test_standalone_master0"}]}},"rabbitmq_settings":{"rabbitmq-driver":{"hosts":["rabbit-0","rabbit-1","rabbit-2"],"port":5672,"login":"guest","password":"guest","vhost":"/"}}}'
    ports:
      - "8080"
    volumes:
      - ./configs:/app/configs:ro
    networks:
      - social-net-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  social-net-network:
    driver: bridge

volumes:
  postgres-master-data:
    driver: local
  citus-coordinator-data:
    driver: local
  citus-worker-0-data:
    driver: local
  citus-worker-1-data:
    driver: local
